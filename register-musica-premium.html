<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Stackly Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--gold:#d8a63c;--light-gold:#f2c45f;--cream:#f5f2ea;--dark:#050504}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#050504;color:var(--cream)}
body{overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-4;background:
radial-gradient(circle at 18% 20%,rgba(216,166,60,.12),transparent 28%),
radial-gradient(circle at 82% 70%,rgba(216,166,60,.09),transparent 30%),
linear-gradient(135deg,#050504,#0c0904 52%,#050504)}
body::after{content:"";position:fixed;inset:0;z-index:-3;opacity:.18;background-image:
linear-gradient(rgba(216,166,60,.09) 1px,transparent 1px),
linear-gradient(90deg,rgba(216,166,60,.09) 1px,transparent 1px);background-size:64px 64px}
.login-page{min-height:100vh;display:flex;position:relative;overflow:hidden}
.login-left,.login-right{position:relative;z-index:2}
.login-left{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4rem 5vw}
.login-right{flex:1;display:flex;align-items:center;justify-content:center;padding:2rem 5vw}
.brand{display:inline-flex;align-items:center;gap:14px;text-decoration:none;color:var(--cream);width:max-content}
.login-left .brand{margin-bottom:3rem}
.brand-logo{width:58px;height:58px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 25px rgba(216,166,60,.12)}
.brand-logo img{width:78%;height:78%;object-fit:contain;filter:brightness(0)saturate(100%) invert(69%) sepia(53%) saturate(1020%) hue-rotate(359deg) brightness(97%) contrast(96%)}
.brand-text h1{font:700 1.7rem/1 "Playfair Display",serif;letter-spacing:.08em;margin:0;color:var(--cream)}
.brand-text span{display:block;color:var(--gold);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;margin-top:5px}
.login-left h1{font:700 clamp(3rem,5vw,5.5rem)/.95 "Playfair Display",serif;margin:0 0 1rem}
.login-left h1 span{background:linear-gradient(135deg,var(--gold),var(--light-gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.login-left p{color:rgba(245,242,234,.62);font-size:1.05rem;max-width:430px;line-height:1.75}
.back-link{display:inline-flex;align-items:center;gap:.5rem;color:rgba(245,242,234,.55);text-decoration:none;font-size:.85rem;margin-top:2rem}
.back-link:hover{color:var(--gold)}
.login-card{width:100%;max-width:470px;padding:3rem;background:rgba(10,8,5,.78);backdrop-filter:blur(28px);border:1px solid rgba(216,166,60,.2);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.35)}
.login-card h2{font:700 2rem "Playfair Display",serif;margin:0 0 .5rem}
.subtitle{color:rgba(245,242,234,.5);font-size:.9rem;margin:0 0 1.8rem}
.login-form{display:flex;flex-direction:column;gap:1.05rem}
.login-form input,.role-select{width:100%;padding:1rem 1.15rem;background:rgba(255,255,255,.035);border:1px solid rgba(216,166,60,.16);border-radius:12px;color:var(--cream);font:400 .95rem Inter,Arial;outline:none}
.login-form input:focus,.role-select:focus{border-color:var(--gold);box-shadow:0 0 20px rgba(216,166,60,.1)}
.login-form input::placeholder{color:rgba(245,242,234,.3)}
.role-wrap{position:relative}
.role-wrap::after{content:"⌄";position:absolute;right:17px;top:50%;transform:translateY(-50%);color:var(--gold);pointer-events:none}
.role-select{appearance:none;cursor:pointer}
.role-select option{background:#0b0905;color:var(--cream)}
.role-label{display:block;color:var(--gold);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 .45rem}
.login-options{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:rgba(245,242,234,.5)}
.login-options label{display:flex;align-items:center;gap:.45rem}
.login-options a{color:var(--gold);text-decoration:none}
.main-btn,.register-btn{width:100%;padding:1rem;border:0;border-radius:12px;background:var(--gold);color:#080706;font:600 .92rem Inter,Arial;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:.3s}
.main-btn:hover,.register-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(216,166,60,.28)}
.divider{display:flex;align-items:center;gap:1rem;margin:.7rem 0;color:rgba(245,242,234,.3);font-size:.78rem}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:rgba(216,166,60,.1)}
.google-btn{width:100%;padding:.9rem;background:rgba(255,255,255,.025);border:1px solid rgba(216,166,60,.15);border-radius:12px;color:var(--cream);display:flex;align-items:center;justify-content:center;gap:.75rem;cursor:pointer}
.register-line{text-align:center;color:rgba(245,242,234,.48);font-size:.84rem;margin:1.3rem 0 0}
.register-line a{color:var(--gold);text-decoration:none;font-weight:600}
.music-svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.music-svg .staff{fill:none;stroke:rgba(216,166,60,.16);stroke-width:1;stroke-dasharray:8 14;animation:staff 18s linear infinite}
.music-svg .wave{fill:none;stroke:rgba(242,196,95,.3);stroke-width:1.5;stroke-dasharray:3 10;animation:wave 10s linear infinite}
.music-svg .note{fill:rgba(242,196,95,.68);filter:drop-shadow(0 0 10px rgba(216,166,60,.25));animation:note 6s ease-in-out infinite}
.music-svg .note:nth-of-type(2){animation-delay:-2s}.music-svg .note:nth-of-type(3){animation-delay:-4s}.music-svg .note:nth-of-type(4){animation-delay:-1s}
@keyframes staff{to{stroke-dashoffset:-220}}@keyframes wave{to{stroke-dashoffset:-260}}@keyframes note{0%,100%{transform:translateY(8px);opacity:.35}50%{transform:translateY(-16px);opacity:.9}}
@media(max-width:900px){
.login-page{flex-direction:column}.login-left{padding:2.2rem 1.4rem 1rem;text-align:center}.login-left .brand{margin:0 auto 2rem}.login-left p{margin:0 auto}.login-right{padding:1rem 1.1rem 2.2rem}.login-card{padding:1.6rem;border-radius:18px}.login-left h1{font-size:3rem}
}
</style>

<style>
.register-card{max-width:500px}
.register-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.05rem}
.register-grid .full{grid-column:1/-1}
.terms{font-size:.78rem;line-height:1.5;color:rgba(245,242,234,.45)}
.terms a{color:var(--gold)}
@media(max-width:600px){.register-grid{grid-template-columns:1fr}.register-grid .full{grid-column:auto}}
</style>

<style id="register-full-animation-pack">
/* ===== REGISTER PAGE ANIMATION PACK ===== */
body{
  animation:pageFade .8s ease both;
}
@keyframes pageFade{
  from{opacity:0}
  to{opacity:1}
}

/* Ambient gold orbs */
body::before{
  animation:ambientMove 14s ease-in-out infinite alternate !important;
}
@keyframes ambientMove{
  0%{transform:scale(1) translate3d(0,0,0)}
  50%{transform:scale(1.05) translate3d(1.5%,1%,0)}
  100%{transform:scale(1.02) translate3d(-1%,2%,0)}
}

/* Moving grid */
body::after{
  animation:gridMove 24s linear infinite !important;
}
@keyframes gridMove{
  from{background-position:0 0,0 0}
  to{background-position:64px 64px,-64px 64px}
}

/* Left content reveal */
.login-left .brand{
  animation:slideInLeft .8s cubic-bezier(.2,.8,.2,1) both;
}
.login-left h1{
  animation:slideInLeft .9s .12s cubic-bezier(.2,.8,.2,1) both;
}
.login-left p{
  animation:slideInLeft .9s .22s cubic-bezier(.2,.8,.2,1) both;
}
.login-left .back-link{
  animation:slideInLeft .9s .32s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes slideInLeft{
  from{opacity:0;transform:translateX(-35px)}
  to{opacity:1;transform:translateX(0)}
}

/* Card reveal */
.register-card{
  animation:cardReveal 1s .12s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardReveal{
  from{opacity:0;transform:translateY(35px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* Gold breathing border */
.register-card{
  animation:
    cardReveal 1s .12s cubic-bezier(.16,1,.3,1) both,
    cardGlow 5s 1.2s ease-in-out infinite;
}
@keyframes cardGlow{
  0%,100%{box-shadow:0 30px 90px rgba(0,0,0,.35),0 0 0 rgba(216,166,60,0)}
  50%{box-shadow:0 30px 90px rgba(0,0,0,.35),0 0 38px rgba(216,166,60,.08)}
}

/* Inputs animate in sequentially */
.register-grid > input:nth-child(1){animation:fieldUp .6s .35s both}
.register-grid > input:nth-child(2){animation:fieldUp .6s .42s both}
.register-grid > input:nth-child(3){animation:fieldUp .6s .49s both}
.register-grid > input:nth-child(4){animation:fieldUp .6s .56s both}
.register-grid > input:nth-child(5){animation:fieldUp .6s .63s both}
.register-grid > div{animation:fieldUp .6s .70s both}
.terms{animation:fieldUp .6s .77s both}
.register-btn{animation:fieldUp .6s .84s both}
.register-line{animation:fieldUp .6s .91s both}

@keyframes fieldUp{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:translateY(0)}
}

/* Input focus glow */
.login-form input,
.role-select{
  transition:
    border-color .3s ease,
    box-shadow .3s ease,
    background .3s ease,
    transform .3s ease !important;
}
.login-form input:focus,
.role-select:focus{
  transform:translateY(-1px) !important;
  background:rgba(216,166,60,.045) !important;
}

/* Select arrow pulse */
.role-wrap::after{
  animation:arrowPulse 2.5s ease-in-out infinite;
}
@keyframes arrowPulse{
  0%,100%{opacity:.55}
  50%{opacity:1}
}

/* Button shimmer */
.register-btn{
  position:relative !important;
  overflow:hidden !important;
}
.register-btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-120%;
  width:70%;
  height:100%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.28),transparent);
  transform:skewX(-18deg);
  animation:buttonShimmer 4s 1.8s ease-in-out infinite;
}
.register-btn{
  box-shadow:0 8px 24px rgba(216,166,60,.12);
}
@keyframes buttonShimmer{
  0%,45%{left:-120%}
  70%,100%{left:150%}
}

/* Floating musical notes */
.music-svg .note{
  animation:
    noteFloat 6s ease-in-out infinite,
    noteGlow 3s ease-in-out infinite alternate !important;
}
@keyframes noteFloat{
  0%,100%{transform:translateY(10px) rotate(-4deg)}
  50%{transform:translateY(-22px) rotate(5deg)}
}
@keyframes noteGlow{
  from{filter:drop-shadow(0 0 5px rgba(216,166,60,.18))}
  to{filter:drop-shadow(0 0 18px rgba(216,166,60,.5))}
}

/* Musical staff / waveform motion */
.music-svg .staff{
  animation:staffFlow 18s linear infinite !important;
}
.music-svg .wave{
  animation:waveFlow 9s linear infinite !important;
}
@keyframes staffFlow{
  from{stroke-dashoffset:0}
  to{stroke-dashoffset:-280}
}
@keyframes waveFlow{
  from{stroke-dashoffset:0}
  to{stroke-dashoffset:-320}
}

/* Brand logo soft pulse */
.brand-logo{
  animation:logoPulse 4s ease-in-out infinite;
}
@keyframes logoPulse{
  0%,100%{box-shadow:0 0 20px rgba(216,166,60,.08)}
  50%{box-shadow:0 0 30px rgba(216,166,60,.18)}
}

/* Back link arrow motion */
.back-link:hover svg{
  transform:translateX(-4px);
}
.back-link svg{
  transition:transform .3s ease;
}

/* Mobile animation stays smooth */
@media(max-width:900px){
  .login-left .brand{animation-delay:.05s}
  .register-card{animation-delay:.05s}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>

</head>
<body>

<div class="music-svg" aria-hidden="true">
<svg viewBox="0 0 1440 900" preserveAspectRatio="none" width="100%" height="100%">
<g class="staff">
<path d="M-40 180 C250 145 430 230 720 190 S1180 130 1480 190"/>
<path d="M-40 193 C250 158 430 243 720 203 S1180 143 1480 203"/>
<path d="M-40 206 C250 171 430 256 720 216 S1180 156 1480 216"/>
<path d="M-40 219 C250 184 430 269 720 229 S1180 169 1480 229"/>
<path d="M-40 232 C250 197 430 282 720 242 S1180 182 1480 242"/>
</g>
<path class="wave" d="M-30 700 C120 640 170 760 310 700 S500 640 650 700 S840 760 990 700 S1180 640 1330 700 S1450 730 1490 700"/>
<text x="9%" y="28%" class="note" font-size="68">♪</text>
<text x="86%" y="32%" class="note" font-size="76">♫</text>
<text x="22%" y="76%" class="note" font-size="52">♬</text>
<text x="78%" y="80%" class="note" font-size="58">♪</text>
</svg>
</div>

<div class="login-page">
  <div class="login-left">
    <a href="index.html" class="brand">
      <div class="brand-logo"><img src="assets/logo.webp" alt="Stackly Music"></div>
      <div class="brand-text"><h1>STACKLY</h1><span>Feel The Music</span></div>
    </a>
    <h1>Join the<br><span>Journey</span></h1>
    <p>Create your Stackly Music account and unlock your personalized musical experience.</p>
    <a href="login-musica-role-fixed.html" class="back-link">← Already have an account? Sign in</a>
  </div>

  <div class="login-right">
    <div class="login-card register-card">
      <h2>Create Account</h2>
      <p class="subtitle">Set up your profile and choose your musical role.</p>

      <form class="login-form" id="registerForm">
        <div class="register-grid">
          <input type="text" id="firstName" placeholder="First name" required>
          <input type="text" id="lastName" placeholder="Last name" required>
          <input class="full" type="email" id="regEmail" placeholder="Email address" required>
          <input type="password" id="regPassword" placeholder="Password" minlength="6" required>
          <input type="password" id="confirmPassword" placeholder="Confirm password" minlength="6" required>

          <div class="full">
            <label class="role-label" for="role">Choose your dashboard</label>
            <div class="role-wrap">
              <select class="role-select" id="role" required>
                <option value="">Select your role</option>
                <option value="player-dashboard.html">Player — I create and perform music</option>
                <option value="listener-dashboard.html">Listener — I discover and enjoy music</option>
              </select>
            </div>
          </div>
        </div>

        <label class="terms">
          <input type="checkbox" id="terms" required style="width:auto;padding:0">
          I agree to the <a href="404.html">Terms &amp; Condition</a> and <a href="404.html">Privacy Policy</a>.
        </label>

        <button class="register-btn" type="submit">Create Account →</button>

        <p class="register-line">Already registered? <a href="login.html">Sign in</a></p>
      </form>
    </div>
  </div>
</div>



<script id="register-role-flow-final">
document.getElementById('registerForm').addEventListener('submit',function(e){
  e.preventDefault();

  const password = document.getElementById('regPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const role = document.getElementById('role').value;

  if(password !== confirm){
    alert('Passwords do not match.');
    return;
  }

  if(!role){
    alert('Please choose Player or Listener.');
    return;
  }

  window.location.href = role;
});
</script>

</body>
</html>
